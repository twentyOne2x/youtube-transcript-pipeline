name: Knowledge Base

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "docs/**"
      - "scripts/knowledge_check.py"
      - ".github/workflows/knowledge-base.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "docs/**"
      - "scripts/knowledge_check.py"
      - ".github/workflows/knowledge-base.yml"

jobs:
  verify-knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run knowledge check
        run: python3 scripts/knowledge_check.py
